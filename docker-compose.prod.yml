# The public Exodus deployment: the same demo as docker-compose.yml, behind
# nginx with HTTPS on the normal ports (80 and 443), at https://<EXODUS_DOMAIN>
# (for example https://exodus.markets). It expects a server of its own.
#
#   cp .env.prod.example .env          then set EXODUS_DOMAIN, ADMIN_PASSWORD, ...
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d                # nginx starts with a self-signed cert
#   docker compose -f docker-compose.prod.yml run --rm certbot     # once: the real certificate
#   docker compose -f docker-compose.prod.yml restart nginx        # once: pick it up
#
# Full steps (server, DNS records, certificate, reset): docs/deploy.md.
#
# Differences from docker-compose.yml:
#   nginx          replaces `vite preview`: serves the built web app over HTTPS
#                  and forwards /api and /v2. The only published ports (80, 443).
#   certbot        gets the Let's Encrypt certificate with an HTTP-01 check (a
#                  file served by nginx on port 80). Runs only when asked for.
#   certbot-renew  renews it on its own before it expires (every 12 hours it
#                  asks; certbot only renews in the last 30 days).
#   The admin password comes from .env and the session cookie is Secure.
#
# The ledger is in memory: after a reboot, or to reset the demo, run
# `docker compose -f docker-compose.prod.yml down` then `up -d` (the certificate
# stays, it is in a volume).
#
# "USYC" and "USDC" are SIMULATED tokens issued by demo parties, not by Circle.
name: exodus-prod

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
  image: exodus-prod-app
  environment: &app-env
    # The database is only reachable inside this compose network.
    DATABASE_URL: postgresql://exodus:exodus@db:5432/exodus
    LEDGER_URL: http://ledger:7575
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@exodus.local}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 10 characters)}
    FAUCET_AMOUNT: "1000.0"
    COOKIE_SECURE: "true"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: exodus
      POSTGRES_PASSWORD: exodus
      POSTGRES_DB: exodus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exodus -d exodus"]
      interval: 2s
      timeout: 3s
      retries: 30

  ledger:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ledger
    image: exodus-prod-ledger
    # The sandbox (a Java process) gets a hard RAM ceiling. Without one, the JVM
    # sizes its heap from the WHOLE server's RAM, keeps growing (the in-memory
    # ledger keeps every transaction), and the kernel's OOM killer ends up
    # killing the sandbox, or PostgreSQL, or anything else on the server. Example: with the default 3g, the heap may use at most 1.5 GB and
    # the rest (about 1.5 GB) is left for Java's own non-heap memory.
    # Change it with LEDGER_MEM_LIMIT in .env (for example 4g on an 8 GB server).
    mem_limit: ${LEDGER_MEM_LIMIT:-3g}
    environment:
      # Every JVM reads JAVA_TOOL_OPTIONS, also the one `dpm sandbox` starts.
      # MaxRAMPercentage=50: heap = half of mem_limit (Canton warns above half).
      # ExitOnOutOfMemoryError: if the heap is ever full, stop cleanly with a clear
      # "OutOfMemoryError" in `logs ledger`, instead of hanging in garbage collection.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7575/v2/state/ledger-end >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60

  setup:
    <<: *app
    working_dir: /exodus/exodus-app
    command:
      - sh
      - -c
      - >-
        cd api && npx prisma migrate deploy && node dist/scripts/seed-admin.js &&
        cd .. && npm run bootstrap
    depends_on:
      db:
        condition: service_healthy
      ledger:
        condition: service_healthy

  oracle:
    <<: *app
    working_dir: /exodus/exodus-app
    command: ["node", "oracle-bot/src/main.ts", "--hold"]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

  api:
    <<: *app
    working_dir: /exodus/exodus-app/api
    environment:
      <<: *app-env
      PORT: "3000"
    command: ["node", "--enable-source-maps", "dist/main.js"]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: proxy
    image: exodus-prod-proxy
    environment:
      EXODUS_DOMAIN: ${EXODUS_DOMAIN:?Set EXODUS_DOMAIN in .env, for example exodus.markets}
      # Fill in only our variables, never nginx's own ($host, $uri, ...).
      NGINX_ENVSUBST_FILTER: "^(EXODUS_|SSL_)"
    # Reload nginx every 6 hours, so a certificate that certbot-renew just
    # renewed is picked up without anyone restarting it. Then hand over to the
    # image's normal start (fill in the template, run nginx in the foreground).
    command:
      - /bin/sh
      - -c
      - >-
        (while :; do sleep 6h; nginx -s reload; done) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      # certbot writes the HTTP-01 token files here; nginx serves them on port 80.
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      - api

  # One-shot: `docker compose -f docker-compose.prod.yml run --rm certbot`.
  # Gets the first certificate, for EXODUS_DOMAIN and www.EXODUS_DOMAIN (both
  # need an A record). nginx must already be running: Let's Encrypt checks the
  # token file it serves on port 80. The certificate is saved under the name
  # EXODUS_DOMAIN, which is where 15-exodus-cert.envsh looks for it.
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --cert-name=${EXODUS_DOMAIN:?Set EXODUS_DOMAIN in .env}
      - --domain=${EXODUS_DOMAIN:?Set EXODUS_DOMAIN in .env}
      - --domain=www.${EXODUS_DOMAIN:?Set EXODUS_DOMAIN in .env}
      - --email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
      - --agree-tos
      - --no-eff-email
      - --non-interactive

  # Always on: asks certbot to renew every 12 hours. certbot does nothing until
  # the certificate has less than 30 days left (it lasts 90), then renews it with
  # the same HTTP-01 check. nginx reloads itself every 6 hours (see above).
  # Before the first certificate exists there is nothing to renew: it just waits.
  certbot-renew:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      # `sleep & wait` (not a plain sleep) so `docker compose down` stops it at once.
      - >-
        trap exit TERM;
        while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 12h & wait $${!}; done
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  letsencrypt:
  certbot-www:
