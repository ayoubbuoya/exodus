<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Exodus</title>
    <!-- Apply the saved theme before the page paints, so a light-mode user never sees a dark flash.
         Same storage key as src/components/theme/ThemeProvider.tsx. -->
    <script>
      try {
        if (localStorage.getItem('exodus-theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
